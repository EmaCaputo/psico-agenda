<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="glyph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- Subtle circular glow -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.07" />
  
  <!-- Greek letter Psi (Ψ) stylized with calendar / heartbeat touch -->
  <g filter="url(#shadow)" fill="none" stroke="url(#glyph)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center vertical stem -->
    <line x1="256" y1="120" x2="256" y2="390" />
    <!-- Horizontal base bar -->
    <line x1="200" y1="390" x2="312" y2="390" />
    <!-- The U-curve of Psi -->
    <path d="M 160 180 C 160 300, 352 300, 352 180" />
    <!-- Small spark/heart dot above -->
    <circle cx="256" cy="115" r="10" fill="#ffffff" />
  </g>
</svg>
